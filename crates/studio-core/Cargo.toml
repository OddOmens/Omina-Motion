[package]
name = "studio-core"
description = "Project data model, time math, playback timing and the project file format for Studio. No UI or I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The project file format (JSON), so projects are readable and diff cleanly.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` reads every number back exactly as it was written, so a project that is
# saved and reopened is identical (the default parser can be off in the last digit).
serde_json = { version = "1", features = ["float_roundtrip"] }
# Reads SVG files (resolving styles, `<use>`, transforms and arcs) into plain paths, for SVG
# import. Text and system fonts are left out: SVG text isn't brought in.
usvg = { version = "=0.45.1", default-features = false }
# Iris, the assistant shared with Canvas and Develop: how typed instructions are read.
iris.workspace = true

[lints]
workspace = true
