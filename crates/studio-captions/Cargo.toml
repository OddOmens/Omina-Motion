[package]
name = "studio-captions"
description = "Automatic captions for Studio: speech to timed text with OpenAI's Whisper (tiny) model, run locally with Candle. No UI and no network: the model files are read from disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
studio-media = { path = "../studio-media" }
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
serde_json = "1"

# The Mac's GPU, through Metal.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.1", features = ["metal"] }
candle-nn = { version = "=0.9.1", features = ["metal"] }
candle-transformers = { version = "=0.9.1", features = ["metal"] }
# candle-core 0.9.1 needs the kernels from its own release; 0.9.2 changed their API.
candle-metal-kernels = "=0.9.1"

[lints]
workspace = true
