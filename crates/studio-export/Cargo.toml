[package]
name = "studio-export"
description = "Exports Studio compositions to movies, GIFs and PNG sequences: GPU rendering, audio mixing and encoding. No UI, so it also runs on a headless render machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
studio-core.workspace = true
studio-render = { path = "../studio-render" }
studio-media = { path = "../studio-media" }
# Animated GIFs (with its own color picking per frame) and PNG sequences, both pure Rust.
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# Reads exported GIFs and PNGs back in the tests.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
