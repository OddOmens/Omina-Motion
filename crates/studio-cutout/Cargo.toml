[package]
name = "studio-cutout"
description = "Background removal for Studio: picks out a subject from a few clicks with the MobileSAM segmentation model, run locally with Candle, and follows it through video. No UI and no network: the model file is read from disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# The Mac's GPU, through Metal.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "=0.9.1", features = ["metal"] }
candle-nn = { version = "=0.9.1", features = ["metal"] }
candle-transformers = { version = "=0.9.1", features = ["metal"] }
# candle-core 0.9.1 needs the kernels from its own release; 0.9.2 changed their API.
candle-metal-kernels = "=0.9.1"

[lints]
workspace = true
