[package]
name = "studio-render"
description = "Studio's GPU compositor: renders a composition frame with wgpu. No UI dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
studio-core.workspace = true
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
# 16-bit floats, for uploading lookup tables as filterable 3D textures.
half = "2"
pollster = "0.4"
cosmic-text = "0.19"
tiny-skia = "0.11"
# Draws SVG files used as picture layers. The same version as the `usvg` that `studio-core` reads SVGs with.
resvg = "=0.45.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
