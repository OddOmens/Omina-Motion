[package]
name = "studio-media"
description = "Media probing, video and audio decoding, and audio playback for Studio, built on FFmpeg."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
studio-core.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
# Audio output through the system sound API (CoreAudio, WASAPI, ALSA).
cpal = "0.18"
# Lock-free queue that hands mixed audio to the sound card thread without ever blocking it.
rtrb = "0.4"

# Like the rest of the workspace, except that `unsafe` is denied rather than forbidden, so the two
# modules that call FFmpeg directly (`hardware.rs` for hardware decoding, `color.rs` for the
# scaler's YUV formula) can opt in explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
