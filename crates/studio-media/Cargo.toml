[package]
name = "studio-media"
description = "Media probing, video and audio decoding, and audio playback for Studio, built on FFmpeg."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
studio-core.workspace = true
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
# Only to switch on FFmpeg build options that ffmpeg-next doesn't pass through (see `bundled-ffmpeg`).
ffmpeg-sys-next = { version = "9", default-features = false, optional = true }
# Audio output through the system sound API (CoreAudio, WASAPI, ALSA).
cpal = "0.18"
# Lock-free queue that hands mixed audio to the sound card thread without ever blocking it.
rtrb = "0.4"

[features]
# Builds FFmpeg from source into Studio, statically, so the app needs nothing installed: H.264 via
# x264 (static, from PKG_CONFIG_PATH; see scripts/release-macos.sh), VideoToolbox for hardware
# decoding, and zlib. FFmpeg with x264 is GPLv3, which is Studio's license. Without this feature,
# Studio links the system's FFmpeg, which is quicker for development.
bundled-ffmpeg = [
    "ffmpeg-next/build",
    "ffmpeg-next/build-license-gpl",
    "ffmpeg-next/build-license-version3",
    "ffmpeg-next/build-lib-x264",
    "ffmpeg-next/build-zlib",
    "dep:ffmpeg-sys-next",
    "ffmpeg-sys-next/build-videotoolbox",
]

# Like the rest of the workspace, except that `unsafe` is denied rather than forbidden, so the two
# modules that call FFmpeg directly (`hardware.rs` for hardware decoding, `color.rs` for the
# scaler's YUV formula) can opt in explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
