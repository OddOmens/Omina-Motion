# Studio workspace. Engine crates live in `crates/`, runnable programs in `apps/`.
# The engine never depends on the UI, so the same crates power the desktop app
# and a headless render node.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
publish = false
# Studio is open source under the GPL, version 3 or later (see LICENSE). FFmpeg and x264, built
# into release builds, are GPL too.
license = "GPL-3.0-or-later"
authors = ["Odd Omens LLC"]

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
studio-dsp = { path = "crates/studio-dsp" }
iris = { path = "crates/iris" }
# Pinned exactly: GPUI is pre-1.0, so upgrades are deliberate.
gpui-kit = "=0.8.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies are optimized even in debug builds so the UI stays smooth while developing.
[profile.dev.package."*"]
opt-level = 2

# The renderer works through every pixel of a frame, which is many times slower unoptimized:
# a nested composition or a path being reshaped took a fifth to half a second a frame.
[profile.dev.package.studio-render]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
